name: Deploy to Development
on:
  pull_request:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Deno Deploy
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deploy to Deno Deplo
        run: deno deploy --token ${{ secrets.DENO_DEPLOY_TOKEN }}
